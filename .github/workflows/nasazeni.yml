# Nasazení webu na Cloudflare Pages.
#
# Potřebuje dvě tajné proměnné v repozitáři (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   – Cloudflare → My Profile → API Tokens → Create Token
#                            → šablona „Edit Cloudflare Workers“ (obsahuje i Pages),
#                            nebo vlastní token s oprávněním Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID  – Cloudflare → Workers & Pages → vpravo „Account ID“
#
# Volitelně:
#   proměnná (Variables) SITE_URL             – výsledná adresa webu, kvůli kanonickým odkazům,
#                                               sitemapě a RSS, např. https://klub-komensky-web.pages.dev
#   tajná proměnná PUBLIC_WEB3FORMS_KEY       – odesílání formulářů přímo z webu

name: Nasazení na Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nasazeni
  cancel-in-progress: true

jobs:
  nasadit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      # prebuild v package.json přitom stáhne fotky a dokumenty ze starého webu,
      # pokud ještě nejsou v repozitáři
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_KEY }}

      - name: Založení projektu na Cloudflare Pages (proběhne jen poprvé)
        continue-on-error: true
        run: npx --yes wrangler@4 pages project create klub-komensky-web --production-branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Nasazení
        run: npx --yes wrangler@4 pages deploy dist --project-name klub-komensky-web --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
