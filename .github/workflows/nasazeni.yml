# Build a nasazení webu na Cloudflare Workers.
#
# Build běží při každém pushi do main a hlídá, že se web postaví.
#
# Nasazení proběhne jen tehdy, když jsou v repozitáři vyplněné tajné proměnné
# (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   – Cloudflare → My Profile → API Tokens → Create Token
#                            → šablona „Edit Cloudflare Workers“
#   CLOUDFLARE_ACCOUNT_ID  – Cloudflare → Workers & Pages → vpravo „Account ID“
# Bez nich se krok nasazení přeskočí (build ale nespadne).
#
# Pokud je Worker klub-komensky-web propojený s tímhle repozitářem přímo
# v Cloudflare (Workers Builds), nasazuje se sám a tyhle proměnné nejsou potřeba.
#
# Volitelně: proměnná SITE_URL (výsledná adresa webu – kanonické odkazy, sitemapa,
# RSS) a tajná proměnná PUBLIC_WEB3FORMS_KEY (odesílání formulářů z webu).

name: Build a nasazení

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nasazeni
  cancel-in-progress: true

jobs:
  nasadit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      # prebuild přitom stáhne fotky a dokumenty ze starého webu,
      # pokud ještě nejsou v repozitáři
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_KEY }}

      - name: Nasazení na Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx --yes wrangler@4 deploy

      - name: Bez nasazení
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "Web se postavil, nasazení přeskočeno – chybí CLOUDFLARE_API_TOKEN nebo CLOUDFLARE_ACCOUNT_ID."
